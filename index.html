 if(chat==="p")$("peerList").innerHTML=peerIds().map(id=>{const c=S.c.find(x=>x.id===id);return `<button class="${peer===id?"":"g"}" style="margin:0 6px 6px 0;padding:8px 12px" onclick="peer='${id}';renderChat()">${c?img(c.logo,"mini"):"👤 "}${esc(pname(id))}</button>`}).join("")||'<span class="sub">مفيش حد تكلمه لسه</span>';
 const bb=$("banBox");if(bb)bb.innerHTML=me&&me.golden&&S.bans.length?`<div class="note">🚫 المحظورين: ${S.bans.map(b=>esc(b.name||b.uid.slice(0,6))+` <a href="#" onclick="mod('unban','${b.uid}');return false">فك</a>`).join(" · ")}</div>`:"";
 const r=roomNow(),list=r?S.m.concat(pending).filter(m=>m.room===r):[];let h=list.map(mhtml).join("");
 if(!user)h='<div class="sub" style="margin:auto">سجّل دخول الأول</div>';
 else if(chat==="v"&&!me)h='<div class="sub" style="margin:auto;text-align:center">الشات ده للناخبين المسجلين بس.<br>قدّم من صفحة التقديم الأول.</div>';
 else if(chat==="p"&&!peer)h='<div class="sub" style="margin:auto">اختار حد من فوق</div>';
 else if(!h)h='<div class="sub" style="margin:auto">ابدأ الكلام 👋<br><small>اضغط ضغطة طويلة على أي رسالة للحذف أو الإبلاغ</small></div>';
 const near=box.scrollHeight-box.scrollTop-box.clientHeight<120;box.innerHTML=h;
 if(near||!box.dataset.s){box.scrollTop=box.scrollHeight;box.dataset.s=1}
 markVisible(list)}
/* ضغطة طويلة على الرسالة */
function bindLP(){const box=$("msgs");let sx=0,sy=0;
 const open=e=>{const el=e.target.closest&&e.target.closest(".m");if(!el||!el.dataset.id)return;msgSheet(+el.dataset.id)};
 box.addEventListener("pointerdown",e=>{if(!e.target.closest(".m"))return;sx=e.clientX;sy=e.clientY;clearTimeout(lpT);lpT=setTimeout(()=>open(e),480)});
 ["pointerup","pointercancel","pointerleave"].forEach(t=>box.addEventListener(t,()=>clearTimeout(lpT)));
 box.addEventListener("pointermove",e=>{if(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8)clearTimeout(lpT)});
 box.addEventListener("contextmenu",e=>{if(e.target.closest(".m")){e.preventDefault();open(e)}})}
function msgSheet(id){const m=S.m.find(x=>x.id===id);if(!m)return;om=null;const mine=user&&m.from_id===user.id,g=me&&me.golden;
 const prev=m.kind==="text"?esc(String(m.text).slice(0,120)):"["+(m.kind==="image"?"صورة":m.kind==="video"?"فيديو":"ملصق")+"]";
 $("prof").innerHTML=`<h3>الرسالة</h3><div class="note" style="margin:6px 0 12px">${prev}</div>`+(mine||g?`<button class="g full" onclick="delMsg(${id})">🗑 حذف الرسالة</button>`:"")+(!mine?`<button class="g full" onclick="repSheet('message',${id},'${m.from_id}')">🚩 إبلاغ عن الرسالة</button>`:"")+(g&&!mine?`<button class="g full" onclick="$('modal').classList.remove('on');mod('ban','${m.from_id}')">🚫 حظر صاحب الرسالة</button>`:"");
 $("modal").classList.add("on")}
async function delMsg(id){$("modal").classList.remove("on");await sb.from("messages").delete().eq("id",id);S.m=S.m.filter(y=>y.id!==id);renderChat()}
function repSheet(kind,id,uid){om=null;const R=["شتيمة","إساءة","محتوى غير لائق","سبام","انتحال","أخرى"];
 $("prof").innerHTML=`<h3>🚩 إبلاغ</h3><p class="note">اختار السبب:</p>`+R.map(r=>`<button class="g full" onclick="sendReport('${kind}',${id},'${uid}','${r}')">${r}</button>`).join("");$("modal").classList.add("on")}
async function sendReport(kind,id,uid,reason){const{data,error}=await sb.rpc("report_item",{p_kind:kind,p_target:uid||null,p_msg:kind==="message"?id:null,p_reason:reason});
 $("prof").innerHTML=`<h3>${data==="ok"?"✅ تم إرسال البلاغ":"تعذّر الإبلاغ"}</h3><p class="note">${error?esc(error.message):data==="ok"?"هيراجعه المنظمين.":esc(data)}</p>`}
async function sendRaw(kind,text){
 const e=$("chatErr"),r=roomNow();e.textContent="";
 if(!user)return false;
 if(chat==="v"&&!me){e.textContent="الشات ده للناخبين المسجلين بس";return false}
 if(chat==="p"&&!peer){e.textContent="اختار حد تكلمه";return false}
 if(S.bans.some(b=>b.uid===user.id)){e.textContent="أنت محظور من الشات";return false}
 const o={room:r,text,kind,cid:DEV+Date.now()};
 if(kind==="text"||kind==="sticker"){pending.push({...o,from_id:user.id,name:me?me.nick:acct});renderChat()}
 const{data,error}=await sb.from("messages").insert(o).select().single();
 pending=pending.filter(x=>x.cid!==o.cid);
 if(error){renderChat();e.textContent="الرسالة ماتبعتتش";return false}
 if(!S.m.some(x=>x.id===data.id))S.m.push(data);renderChat();return true}
async function sendMsg(){const i=$("mi"),t=i.value.trim();if(!t)return;i.value="";i.focus();if(!(await sendRaw("text",t)))i.value=t}

const isBig=t=>{const n=(String(t).match(/\p{Extended_Pictographic}/gu)||[]).length;return n>0&&n<=3&&/^[\p{Extended_Pictographic}\p{Emoji_Modifier}\u200d\ufe0f\s]+$/u.test(t)};
function toggleEmo(){const b=$("stkBox");if(!b.innerHTML)b.innerHTML='<div class="fast">'+FAST.map(e=>`<span onclick="sendEmo('${e}')">${e}</span>`).join("")+'</div><div class="eg">'+EMO.map(e=>`<span onclick="addEmo('${e}')">${e}</span>`).join("")+'</div>';b.classList.toggle("hide")}
function addEmo(e){const i=$("mi");i.value+=e;i.focus()}
function sendEmo(e){$("stkBox").classList.add("hide");sendRaw("text",e)}
function shrink(f){return new Promise(r=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{URL.revokeObjectURL(u);const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);c.toBlob(r,"image/jpeg",.82)};im.onerror=()=>r(null);im.src=u})}
async function sendMedia(){
 const f=$("fl2").files[0],e=$("chatErr");$("fl2").value="";if(!f||!user)return;e.textContent="";
 const vid=/^video\//.test(f.type);
 if(!vid&&!/^image\//.test(f.type)){e.textContent="الملف لازم صورة أو فيديو";return}
 if(vid&&!/mp4|webm|quicktime/.test(f.type)){e.textContent="الفيديو لازم يكون mp4 أو webm";return}
 if(vid&&f.size>20e6){e.textContent="الفيديو كبير، أقصى حجم 20 ميجا";return}
 e.textContent="⏳ جاري الرفع...";
 let blob=f;const ext=vid?(f.type.includes("webm")?"webm":f.type.includes("quicktime")?"mov":"mp4"):"jpg";
 if(!vid){blob=await shrink(f);if(!blob){e.textContent="الصورة دي ماتفتحتش";return}}
 const a=new Uint8Array(12);crypto.getRandomValues(a);const nm=btoa(String.fromCharCode(...a)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=/g,"");
 const path=user.id+"/"+nm+"."+ext;
 const{error}=await sb.storage.from("chat").upload(path,blob,{contentType:vid?f.type:"image/jpeg"});
 if(error){e.textContent="الرفع فشل: "+(error.message||"");return}
 e.textContent="";await sendRaw(vid?"video":"image",path)}
function showMedia(u){om=null;$("prof").innerHTML=`<img src="${u}" style="max-width:100%;border-radius:12px">`;$("modal").classList.add("on")}
$("mi").addEventListener("keydown",e=>{if(e.key==="Enter")sendMsg()});

function faceoff(m){
 const v=S.v[m.id]||{},g=me&&me.golden,a=v.a||0,b=v.b||0,t=a+b||1;
 const can=m.status==="live"&&user&&!g&&!v.mine&&user.id!==m.a&&user.id!==m.b;
 const show=g||v.mine||m.status==="done"||m.status==="tie";
 const sd=(cid,n)=>{const c=cd(cid);if(!c)return'<div class="sd2 tbd"><div class="av big">?</div><b>—</b></div>';
  const p=Math.round(n/t*100),mine=v.mine===cid,pk=sel[m.id]===cid&&can;
  return `<div class="sd2 ${mine?"mine":""} ${pk?"pick":""} ${m.winner===cid?"win":""}" ${can?`onclick="pickSide(${m.id},'${cid}')"`:""}>${mine?`<img class="vbadge" src="${IMG_BADGE}" alt="">`:""}${m.winner===cid?'<span class="wcrown">👑</span>':""}<div class="av big">${img(c.logo)}</div><b>${esc(c.nick)}</b><small>${esc(c.name)}</small><span class="no">رقم ${c.seat||"—"}</span>${show?`<div class="pc"><i style="width:${p}%"></i></div><span class="pn">${p}% · ${n}</span>`:""}</div>`};
 let ctl="";
 if(can)ctl=`<button class="vbtn" ${sel[m.id]?"":"disabled"} onclick="castVote(${m.id})"><img src="${IMG_OK}" alt="صوّت"></button><div class="note">${sel[m.id]?"اضغط على علامة الصح لتأكيد صوتك. مش هتقدر تغيّره.":"اختار واحد من الاتنين"}</div>`;
 else if(v.mine)ctl='<div class="note ok">✓ تم تسجيل صوتك</div>';
 else if(m.status==="live"&&g)ctl='<div class="note">أنت منظّم، مش ناخب</div>';
 else if(m.status==="live"&&user&&(user.id===m.a||user.id===m.b))ctl='<div class="note">أنت طرف في المواجهة دي</div>';
 else if(m.status==="tie")ctl='<div class="note">تعادل، بانتظار قرار المنظم</div>';
 else if(m.status==="pending")ctl='<div class="note">التصويت لسه ما بدأش</div>';
 return `<div class="fo ${m.status}"><div class="fo-top"><span class="fo-no">المواجهة #${numOf(m)}</span><span>${T[m.round]}</span></div><div class="fo-tm tm ${lowCls(m)?"low":""}" data-m="${m.id}">${tmText(m)}</div><div class="fo-row">${sd(m.a,a)}<div class="vs"><svg><use href="#vs"/></svg></div>${sd(m.b,b)}</div><div class="fo-ctl">${ctl}</div></div>`}

 if(error||data!=="ok"){say(error?error.message:data);return}delete sel[mid];await refV()}

function bmc(m){if(!m)return"";const sx=cid=>{const c=cd(cid);return c?`<div class="sd ${m.winner===cid?"win":""}">${img(c.logo,"mini")}${esc(c.nick)}</div>`:'<div class="sd tbd">—</div>'};
 return `<div class="mc ${m.status}" onclick="openMatch(${m.id})"><span class="mn">#${numOf(m)}</span>${sx(m.a)}<div class="tm ${lowCls(m)?"low":""}" data-m="${m.id}">${tmText(m)}</div>${sx(m.b)}</div>`}
function bracket(){
 const by=r=>S.mt.filter(m=>m.round===r).sort((x,y)=>x.pos-y.pos);
 const R=by(1),Q=by(2),Sf=by(3),F=by(4)[0],Th=by(5)[0];
 const cell=(m,col,row,span,cls)=>m?`<div class="bc ${cls}" style="grid-column:${col};grid-row:${row}/span ${span}">${bmc(m)}</div>`:"";
 let h='<div class="bkw"><div class="bk">';
 ["دور الـ16","ربع النهائي","نصف النهائي","النهائي","نصف النهائي","ربع النهائي","دور الـ16"].forEach((t,i)=>h+=`<div class="bl" style="grid-column:${i+1};grid-row:1">${t}</div>`);
 R.slice(0,4).forEach((m,i)=>h+=cell(m,1,2+2*i,2,"L"));
 Q.slice(0,2).forEach((m,i)=>h+=cell(m,2,2+4*i,4,"L in"));
 h+=cell(Sf[0],3,2,8,"L in");
 h+=`<div class="bc cen fin" style="grid-column:4;grid-row:2/span 8"><svg class="trophy"><use href="#trophy"/></svg>${bmc(F)}</div>`;
 h+=cell(Sf[1],5,2,8,"R in");
 Q.slice(2,4).forEach((m,i)=>h+=cell(m,6,2+4*i,4,"R in"));
 R.slice(4,8).forEach((m,i)=>h+=cell(m,7,2+2*i,2,"R"));
 h+=`<div class="bc cen" style="grid-column:4;grid-row:10/span 2"><div class="bl">المركز الثالث</div>${bmc(Th)}</div>`;
 return h+'</div></div>'}

async function draw(redo){
 if(redo&&!confirm("إعادة القرعة؟"))return;
 const{data,error}=await sb.rpc("draw_bracket",{p_redo:!!redo});
 if(error||data!=="ok"){alert(error?error.message:data);return}
 await refMt();om=null;const names=S.c.filter(c=>!c.golden).map(c=>c.nick),rnd=()=>names[Math.floor(Math.random()*names.length)];
 const R=S.mt.filter(m=>m.round===1).sort((a,b)=>a.pos-b.pos);
 $("prof").innerHTML='<h3>🎲 قرعة The Leader</h3><div id="rl"></div><div class="spin" id="sp"></div>';$("modal").classList.add("on");let i=0;
 const step=()=>{const sp=$("sp"),rl=$("rl");if(!sp||!rl)return;if(i>=R.length){sp.textContent="✅ تمت القرعة";return}
  const m=R[i],t=setInterval(()=>{const s=$("sp");if(s)s.textContent=rnd()+"  ⚔️  "+rnd()},60);
  setTimeout(()=>{clearInterval(t);const sp2=$("sp"),r2=$("rl");if(!sp2||!r2)return;sp2.textContent="";const d=document.createElement("div");d.className="card draw";d.innerHTML=`<span class="fo-no">#${numOf(m)}</span> <b>${esc(pname(m.a))}</b> <small>ضد</small> <b>${esc(pname(m.b))}</b>`;r2.appendChild(d);i++;step()},900)};
 step()}

function stageOf(c){if(c.golden)return"منظّم 👑";
 const ms=S.mt.filter(m=>m.a===c.id||m.b===c.id);if(!ms.length)return"في انتظار القرعة";
 const m4=ms.find(m=>m.round===4),m5=ms.find(m=>m.round===5);
 if(m4&&m4.status==="done")return m4.winner===c.id?"🏆 بطل المسابقة":"🥈 وصيف المسابقة";
 if(m5&&m5.status==="done")return m5.winner===c.id?"🥉 المركز الثالث":"المركز الرابع";
 const m=ms.filter(x=>x.round<=4).sort((x,y)=>y.round-x.round)[0];
 if(m.status==="done"&&m.winner!==c.id)return"خرج في "+T[m.round];
 if(m.status==="live")return"في مواجهة الآن ("+T[m.round]+")";
